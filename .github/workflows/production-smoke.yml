name: Production Smart Links Smoke

on:
  schedule:
    # Daily 15:00 UTC — optional read-only production check
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live roamxp.puzdev.com smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production smoke (PostHog blocked)
        env:
          PLAYWRIGHT_BASE_URL: https://roamxp.puzdev.com
        run: npx playwright test --project=production-smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
