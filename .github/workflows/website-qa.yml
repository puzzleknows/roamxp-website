name: Website Smart Links QA

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "get/**"
      - "ig/**"
      - "yt/**"
      - "tt/**"
      - "qr/**"
      - "assets/js/**"
      - "assets/config/**"
      - "assets/badges/**"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-qa.yml"
  pull_request:
    paths:
      - "go/**"
      - "get/**"
      - "ig/**"
      - "yt/**"
      - "tt/**"
      - "qr/**"
      - "assets/js/**"
      - "assets/config/**"
      - "assets/badges/**"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-qa.yml"

concurrency:
  group: website-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright Smart Links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run local Smart Links suite
        run: npx playwright test --project=chromium --project=webkit

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-links-qa-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
